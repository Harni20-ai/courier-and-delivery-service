<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | SwiftDelivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="background: var(--gradient-primary); height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; color: white;">

    <div class="container" style="max-width: 600px;">
        <div class="logo mb-8" style="color: white; font-size: 2.5rem; justify-content: center;">
            <i class="fas fa-truck-fast"></i>
            <span>SwiftDelivery</span>
        </div>
        <h1 style="color: white; font-size: 3rem;">Something Big is Coming</h1>
        <p style="color: rgba(255, 255, 255, 0.9); font-size: 1.25rem;" class="mb-12">We're working hard to bring you a new feature that will revolutionize your shipping experience.</p>
        
        <div class="card" style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);">
            <p style="color: white; font-weight: 500;" class="mb-4">Notify me when it's ready:</p>
            <form class="flex" style="gap: var(--spacing-2);">
                <input type="email" class="form-control" placeholder="your@email.com" style="background: white; border: none;">
                <button type="submit" class="btn btn-secondary" style="background: var(--color-text-primary); color: white;">Notify Me</button>
            </form>
        </div>
        
        <div class="mt-12">
            <a href="index.html" style="color: white; text-decoration: underline;">Back to Home</a>
        </div>
    </div>

</body>
</html>
