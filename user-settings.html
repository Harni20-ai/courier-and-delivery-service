<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | User Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background: var(--color-surface); border-right: 1px solid var(--color-border); padding: var(--spacing-8); display: flex; flex-direction: column; gap: var(--spacing-4); }
        .sidebar-link { padding: var(--spacing-3) var(--spacing-4); border-radius: var(--radius-md); color: var(--color-text-secondary); font-weight: 500; display: flex; align-items: center; gap: var(--spacing-3); transition: all var(--transition-fast); }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(79, 70, 229, 0.1); color: var(--color-primary); }
        .dashboard-content { padding: var(--spacing-12); background: var(--color-bg); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <a href="index.html" class="logo mb-8"><i class="fas fa-truck-fast"></i> <span>SwiftDelivery</span></a>
            <nav style="flex: 1;">
                <a href="user-dashboard.html" class="sidebar-link"><i class="fas fa-chart-line"></i> Overview</a>
                <a href="#" class="sidebar-link"><i class="fas fa-box"></i> My Bookings</a>
                <a href="user-settings.html" class="sidebar-link active"><i class="fas fa-gear"></i> Settings</a>
            </nav>
            <a href="login.html" class="sidebar-link" style="color: #ef4444;"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </aside>

        <main class="dashboard-content">
            <header class="flex-between mb-12">
                <h1>Profile Settings</h1>
                <div class="flex" style="gap: var(--spacing-4);">
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch" for="theme-toggle">
                            <input type="checkbox" id="theme-toggle" />
                            <div class="slider round"><i class="fas fa-sun"></i><i class="fas fa-moon"></i></div>
                        </label>
                    </div>
                    <button id="rtl-toggle" class="btn btn-outline" title="Switch RTL/LTR"><i class="fas fa-globe"></i></button>
                    <img src="https://ui-avatars.com/api/?name=John+Doe" alt="Avatar" style="width: 40px; border-radius: 50%;">
                </div>
            </header>

            <div class="card" style="max-width: 800px;">
                <h3>Personal Information</h3>
                <form class="mt-8">
                    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--spacing-6);">
                        <div class="form-group">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" value="John">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" value="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" value="john@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" value="+1 (555) 000-0000">
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Save Changes</button>
                </form>
            </div>

            <div class="card mt-8" style="max-width: 800px; border-color: #fee2e2;">
                <h3 style="color: #ef4444;">Danger Zone</h3>
                <p>Once you delete your account, there is no going back. Please be certain.</p>
                <button class="btn btn-outline mt-4" style="color: #ef4444; border-color: #ef4444;">Delete Account</button>
            </div>
        </main>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
