<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Settings | SwiftAdmin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .admin-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        .sidebar { background: #1e293b; color: white; padding: var(--spacing-8); display: flex; flex-direction: column; }
        .sidebar-link { padding: var(--spacing-4); border-radius: var(--radius-md); color: #94a3b8; font-weight: 500; display: flex; align-items: center; gap: var(--spacing-3); transition: all var(--transition-fast); }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255, 255, 255, 0.05); color: white; }
        .admin-content { padding: var(--spacing-12); background: var(--color-bg); min-height: 100vh; }
        
        /* Dark Mode Consistency */
        body.dark-mode .admin-content { background: var(--color-bg); color: var(--color-text-primary); }
        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3 { color: var(--color-text-primary); }
        body.dark-mode .card { background: var(--color-surface); border-color: var(--color-border); }
    </style>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo mb-12" style="color: white;"><i class="fas fa-truck-fast"></i> <span>SwiftAdmin</span></div>
            <nav style="flex: 1;">
                <a href="admin-dashboard.html" class="sidebar-link"><i class="fas fa-gauge-high"></i> Dashboard</a>
                <a href="admin-dashboard.html#bookings" class="sidebar-link"><i class="fas fa-calendar-check"></i> Bookings</a>
                <a href="admin-dashboard.html#users" class="sidebar-link"><i class="fas fa-users"></i> Users</a>
                <a href="admin-settings.html" class="sidebar-link active"><i class="fas fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <main class="admin-content">
            <header class="flex-between mb-12">
                <h1>System Settings</h1>
                <div class="flex" style="gap: var(--spacing-4);">
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch" for="theme-toggle">
                            <input type="checkbox" id="theme-toggle" />
                            <div class="slider round"><i class="fas fa-sun"></i><i class="fas fa-moon"></i></div>
                        </label>
                    </div>
                    <button id="rtl-toggle" class="btn btn-outline" title="Switch RTL/LTR"><i class="fas fa-globe"></i></button>
                    <img src="https://ui-avatars.com/api/?name=Admin&background=4f46e5&color=fff" style="width: 40px; border-radius: 50%;">
                </div>
            </header>

            <div class="card">
                <h3>General Configuration</h3>
                <form class="mt-8">
                    <div class="form-group">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" value="SwiftDelivery Courier Service">
                    </div>
                    <div class="form-group">
                        <label class="form-label">System Email</label>
                        <input type="email" class="form-control" value="admin@swiftdelivery.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Maintenance Mode</label>
                        <select class="form-control">
                            <option>Disabled</option>
                            <option>Enabled</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Update System</button>
                </form>
            </div>
        </main>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
